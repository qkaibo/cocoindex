[project]
name = "aosp-learning"
version = "0.1.0"
description = "CocoIndex pipeline: unified code+wiki indexing for AOSP learning — semantic search across C/Java/DTS source and Markdown/RST wiki."
requires-python = ">=3.11"
dependencies = [
    "cocoindex[qdrant,sentence_transformers]>=1.0.7",
    "qdrant-client>=1.14.0",
    "pydantic",
    "numpy",
    "python-dotenv>=1.0.1",
    "prefect>=3.0",
    "pyyaml>=6.0",
    "streamlit>=1.28",
]

[tool.setuptools]
packages = []
