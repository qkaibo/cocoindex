# qcm4490 高通平台索引配置
# 按用户要求:
# 1. amss 全部学习（排除 build 目录 — bringup 生成物，留着等于给答案）
# 2. qssi 全部排除（不扫描）
# 3. target 只取 hardware, kernel_platform, vendor
#
# 文件分布:
#   target/kernel_platform   103K  ┐
#   target/hardware           3.4K ├ BSP (全部 target 下 BSP 范畴)
#   target/vendor              24K ┘
#   amss (排除build)          161K  → AMSS (全部子系统)
#
platforms:
  qcm4490:
    aosp_root: /home/ts/ssd/workspace/code/qcm4490
    wiki_root: ./aosp_wiki
    modules:
      - name: BSP
        code_globs:
          - "target/kernel_platform/**"
          - "target/hardware/**"
          - "target/vendor/**"
          - "amss/**"
        wiki_dir: bsp
        description: "BSP: kernel_platform + hardware + vendor + amss（排除 build 目录）"
  seahorse_wear_base:
    aosp_root: /home/ts/ssd/workspace/code/Seahorse_wear-base
    wiki_root: ./seahorse_wiki
    modules:
      - name: FW
        code_globs:
          - "apps/**"
          - "rtos/**"
          - "bthost/**"
          - "lib/**"
          - "libc_adapter/**"
          - "thirdparty/**"
          - "include/**"
          - "config/**"
          - "platform/**"
          - "services/**"
          - "vendor/**"
          - "multimedia/**"
          - "net/**"
          - "nn/**"
          - "utils/**"
        wiki_dir: seahorse
        description: "Seahorse 穿戴设备固件（RTOS + BTHost + Multimedia + NN）"
